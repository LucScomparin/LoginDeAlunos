{% extends "base.html" %}

{% block titulo %}Minha conta | Login de Alunos{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Olá, {{ aluno.nome }}!</h1>
<p class="subtitulo">RM: {{ aluno.rm }}</p>

<section class="cards">
    <article class="card">
        <h2>Editar nome</h2>
        <form class="form-card" method="post" action="/perfil/editar">
            <label for="nome">Novo nome</label>
            <input type="text" id="nome" name="nome" value="{{ aluno.nome }}" maxlength="50" required>
            <button type="submit" class="botao">Salvar</button>
        </form>
    </article>

    <article class="card">
        <h2>Excluir conta</h2>
        <p>Essa ação apaga sua conta para sempre e não pode ser desfeita.</p>
        <form class="form-card" method="post" action="/perfil/deletar"
              onsubmit="return confirm('Tem certeza que deseja excluir sua conta?');">
            <button type="submit" class="botao botao-perigo">Excluir minha conta</button>
        </form>
    </article>
</section>
{% endblock %}
