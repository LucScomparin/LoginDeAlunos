{% extends "base.html" %}

{% block titulo %}Cadastro | Login de Alunos{% endblock %}

{% block conteudo %}
<h1 class="titulo-pagina">Criar conta</h1>
<p class="subtitulo">Preencha seus dados para se cadastrar.</p>

<form class="formulario" method="post" action="/cadastro">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" maxlength="50" value="{{ nome or '' }}" required>

    <label for="rm">RM</label>
    <input type="number" id="rm" name="rm" value="{{ rm or '' }}" required>

    <button type="submit" class="botao">Cadastrar</button>

    <p class="formulario-link">Já tem conta? <a href="/login">Entrar</a></p>
</form>
{% endblock %}
